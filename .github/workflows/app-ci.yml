name: App CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes do app
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: google-services.json fictício
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {"project_number": "000000000000", "project_id": "sina-ci", "storage_bucket": "sina-ci.appspot.com"},
            "client": [{
              "client_info": {"mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": {"package_name": "br.ia.sina"}},
              "oauth_client": [],
              "api_key": [{"current_key": "chave-ficticia-do-ci"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          JSON

      - name: Rodar testes
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Relatórios de teste (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-reports
          path: app/app/build/reports/tests/
          retention-days: 7
