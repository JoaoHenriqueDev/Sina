name: API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: sina
          POSTGRES_USER: sina
          POSTGRES_PASSWORD: sina
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sina -d sina"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_POSTGRES: sina
      DB_USER: sina
      DB_PASSWORD: sina
      DEVICE_TOKEN_PEPPER: ci-pepper-ficticio-com-mais-de-32-caracteres
      FIREBASE_CREDENTIALS_PATH: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar e rodar testes
        run: ./mvnw -B -ntp verify

      - name: Relatórios de teste (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: api/target/surefire-reports/
          retention-days: 7
